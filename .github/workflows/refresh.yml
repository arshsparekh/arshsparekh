name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # runs when the generator changes; its own commits use GITHUB_TOKEN, which never
  # triggers another run, so this cannot loop
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - scripts/theme.py
      - fonts/subsets/**
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py
      - name: Commit if anything changed
        run: |
          FILES="assets/stats-*.svg assets/year-*.svg assets/langs-*.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
